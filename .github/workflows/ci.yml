name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Guard ground truth isolation
        run: bash scripts/check-ground-truth.sh

  workflows:
    # actionlint checks every workflow (expressions, job graph, and the run: scripts through the
    # shellcheck bundled in the image). Pinned image tag, no local install needed.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

  database:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.119.0
      - run: supabase db start
      - run: supabase db lint --level warning --fail-on error
      - run: bash scripts/db-smoke.sh
