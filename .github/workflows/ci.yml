name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Guard ground truth isolation
        run: |
          if grep -rIl --include='*.ts' --include='*.tsx' --include='*.mjs' --include='*.js' \
               -e 'quality/ground-truth' -e "from ['\"].*quality/" apps packages scripts; then
            echo "Runtime code must not reference quality/ground-truth" && exit 1
          fi

  database:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - run: supabase db start
      - run: supabase db lint --level warning --fail-on error
      - run: bash scripts/db-smoke.sh
